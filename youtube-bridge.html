<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Study Companion Video</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    #player{position:absolute;inset:0;width:100%;height:100%} iframe{display:block;width:100%;height:100%;border:0}
    .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#111;font:600 16px Arial,sans-serif;text-align:center;padding:20px}
    .fallback a{color:#fff;text-decoration:underline}
  </style>
</head>
<body>
  <div id="player"><div class="fallback">Loading study companion…</div></div>
  <script>
    (function(){
      window.addEventListener('message',function(ev){ if(!ev || !ev.data)return; if(ev.data.type==='STOP_COMPANION_VIDEO'){ location.replace('about:blank'); return; } if(ev.data.type==='PAUSE_COMPANION_VIDEO'||ev.data.type==='PLAY_COMPANION_VIDEO'){ var cmd=ev.data.type==='PAUSE_COMPANION_VIDEO'?'pauseVideo':'playVideo'; var inner=document.querySelector('#player iframe'); if(inner) inner.contentWindow.postMessage(JSON.stringify({event:'command',func:cmd,args:[]}), '*'); } });
      var p=new URLSearchParams(location.search);
      var id=p.get('video')||'';
      var auto=p.get('autoplay')==='1';
      if(!/^[A-Za-z0-9_-]{11}$/.test(id)){
        document.getElementById('player').innerHTML='<div class="fallback">No valid YouTube video was provided.</div>';
        return;
      }
      var origin=location.origin && location.origin!=='null' ? location.origin : '';
      var qs=new URLSearchParams({
        playsinline:'1',rel:'0',mute:'1',controls:'1',modestbranding:'1',
        origin:origin,
        enablejsapi:'1',
        widget_referrer:location.href
      });
      if(auto) qs.set('autoplay','1');
      var frame=document.createElement('iframe');
      frame.title='Study companion video';
      frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?'+qs.toString();
      frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      frame.referrerPolicy='strict-origin-when-cross-origin';
      frame.allowFullscreen=true;
      document.getElementById('player').replaceChildren(frame);
    })();
  </script>
</body>
</html>
